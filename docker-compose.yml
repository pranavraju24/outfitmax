# Run the whole app with:  docker compose --env-file .env.local up --build
#
# Supabase (database/auth/storage) runs separately via `npx supabase start`
# (its own Docker stack) or your hosted project — point the env vars below at
# whichever you're using.
services:
  app:
    build:
      context: .
      args:
        # Public values baked into the browser bundle at build time.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
